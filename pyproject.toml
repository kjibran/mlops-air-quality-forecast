[project]
name = "mlops-air-quality-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jibran Khan", email = "6083619+kjibran@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.105",
    "httpx>=0.28.1",
    "huggingface-hub>=2.1.1",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
